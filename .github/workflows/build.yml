name: Build Aether OptExt

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  RUST_TARGET: aarch64-linux-android
  EBPF_TOOLCHAIN: nightly
  BPF_LINKER_VERSION: 0.9.13
  ANDROID_NDK_VERSION: 28.2.13676358
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aether OptExt source
        uses: actions/checkout@v5
        with:
          repository: NetizenNemo/Aether_OptExt
          ref: main
          path: source
          fetch-depth: 1

      # ------------------------------------------------------------
      # 1. Rust stable：用于编译 Android 用户态主程序
      # ------------------------------------------------------------
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ------------------------------------------------------------
      # 2. Rust nightly：用于编译 aya-ebpf
      #
      # 额外安装 rust-src，因为 eBPF 构建使用：
      #   -Zbuild-std=core
      # ------------------------------------------------------------
      - name: Setup Rust nightly for eBPF
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.EBPF_TOOLCHAIN }}
          components: rust-src

      # ------------------------------------------------------------
      # 3. Android SDK / NDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          if [[ ! -d "${NDK_HOME}" ]]; then
            echo "::error::Android NDK was not installed at ${NDK_HOME}"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${NDK_HOME}" >> "${GITHUB_ENV}"

          echo "Installed NDK:"
          cat "${NDK_HOME}/source.properties"
      # ------------------------------------------------------------
      # 4. Rust / Cargo 缓存
      #
      # 缓存：
      #   ~/.cargo/registry
      #   ~/.cargo/git
      #   target/
      #   ebpf/target/
      #
      # key 同时包含：
      #   - Runner OS / 架构
      #   - Rust toolchain
      #   - NDK
      #   - Cargo.toml / Cargo.lock
      #   - eBPF Cargo.toml / config
      #
      # 这样依赖或工具链发生变化时不会错误复用旧产物。
      # ------------------------------------------------------------
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: >-
            aether-optext-rust-
            ${{ runner.os }}-
            ${{ runner.arch }}-
            ${{ env.RUST_TARGET }}-
            nightly-
            ${{ env.BPF_LINKER_VERSION }}-
            ndk-${{ env.ANDROID_NDK_VERSION }}-
            ${{ hashFiles(
              'source/Cargo.toml',
              'source/Cargo.lock',
              'source/ebpf/Cargo.toml',
              'source/ebpf/Cargo.lock',
              'source/ebpf/.cargo/config.toml'
            ) }}

      # ------------------------------------------------------------
      # 5. 单独缓存 bpf-linker
      #
      # 不缓存整个 ~/.cargo/bin，避免把 rustup/cargo 的其他 shim
      # 一并塞进缓存。
      # ------------------------------------------------------------
      - name: Cache bpf-linker
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/bpf-linker
          key: >-
            aether-optext-bpf-linker-
            ${{ runner.os }}-
            ${{ runner.arch }}-
            ${{ env.BPF_LINKER_VERSION }}-
            ${{ env.EBPF_TOOLCHAIN }}

      - name: Install bpf-linker
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -x "${HOME}/.cargo/bin/bpf-linker" ]]; then
            cargo +${EBPF_TOOLCHAIN} install \
              --locked \
              --version "${BPF_LINKER_VERSION}" \
              bpf-linker
          fi

          bpf-linker --version

      # ------------------------------------------------------------
      # 6. 先编译 eBPF
      #
      # 仓库自己的 ebpf/.cargo/config.toml 已经指定：
      #   target = bpfel-unknown-none
      #   linker = bpf-linker
      #
      # 所以这里显式调用：
      #   cargo +nightly build --target bpfel-unknown-none
      #     --release -Zbuild-std=core
      #
      # 最终对象必须放到项目根目录：
      #   ./ebpf_target.o
      #
      # 因为 src/bpf.rs 使用：
      #   include_bytes!(.../ebpf_target.o)
      # ------------------------------------------------------------

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"

          echo "SOURCE=${SRC}"
          echo

          if [[ ! -d "${SRC}" ]]; then
            echo "::error::Source directory does not exist: ${SRC}"
            exit 1
          fi

          echo "Source tree:"
          find "${SRC}" -maxdepth 2 -type f -print | sort
          echo

          # 当前项目构建所必须的目录/文件
          test -d "${SRC}/ebpf"
          test -d "${SRC}/src"
          test -d "${SRC}/magisk_module"
          test -f "${SRC}/build.py"

          # eBPF Cargo 项目
          test -f "${SRC}/ebpf/Cargo.toml"
          test -d "${SRC}/ebpf/.cargo"

          echo
          echo "Required Aether OptExt files found."


      - name: Build eBPF object
        shell: bash
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"

          echo "Source: ${SRC}"
          echo "Building from: ${SRC}/ebpf"

          test -d "${SRC}/ebpf"
          test -f "${SRC}/ebpf/Cargo.toml"

          cd "${SRC}/ebpf"

          cargo +${EBPF_TOOLCHAIN} build \
            --target bpfel-unknown-none \
            --release \
            -Zbuild-std=core

          EBPF_BIN="${SRC}/ebpf/target/bpfel-unknown-none/release/aether-ebpf"
          EBPF_OBJ="${SRC}/ebpf_target.o"

          if [[ ! -f "${EBPF_BIN}" ]]; then
            echo "::error::eBPF binary not found: ${EBPF_BIN}"
            exit 1
          fi

          cp "${EBPF_BIN}" "${EBPF_OBJ}"

          if [[ ! -f "${EBPF_OBJ}" ]]; then
            echo "::error::Failed to create: ${EBPF_OBJ}"
            exit 1
          fi

          echo "eBPF object generated:"
          ls -lh "${EBPF_OBJ}"
      # ------------------------------------------------------------
      # 7. 预取主程序依赖
      #
      # 不是必须，但第一次构建失败时日志更清楚，也能让依赖下载
      # 与真正 build 分开，配合上面的 Cargo cache 更稳定。
      # ------------------------------------------------------------
      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
      
          SRC="${GITHUB_WORKSPACE}/source"
      
          cd "${SRC}"
      
          cargo fetch --locked
      
          cd "${SRC}/ebpf"
      
          cargo +${EBPF_TOOLCHAIN} fetch --locked

      # ------------------------------------------------------------
      # 8. 使用项目官方 build.py
      #
      # build.py 会：
      #   - 自动检测 ANDROID_NDK_HOME
      #   - 创建 .cargo/config.toml
      #   - 设置 Android clang linker
      #   - cargo build --target aarch64-linux-android --release
      #   - 将 binary 复制到 magisk_module/
      #   - 更新 module.prop
      #   - 打包 out/Aether-OptExt_*.zip
      #
      # 因为前面已经生成 ebpf_target.o，所以 build.py 不会尝试走
      # Windows/WSL 的 eBPF 生成分支。
      # ------------------------------------------------------------
      - name: Set stable Rust for main project
        shell: bash
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"

          cd "${SRC}"

          rustup override set stable

          echo "Main project Rust:"
          cargo --version
          rustc --version

          echo
          echo "Installed Android targets:"
          rustup target list --installed | grep -F "aarch64-linux-android"
      
      - name: Build module
        shell: bash
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"

          test -f "${SRC}/build.py"
          test -f "${SRC}/ebpf_target.o"

          cd "${SRC}"

          python3 build.py
      # ------------------------------------------------------------
      # 9. 验证最终 ZIP
      #
      # 防止 build.py 日后修改后悄悄产出空包/错误结构。
      # ------------------------------------------------------------
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"
          OUT="${SRC}/out"

          mapfile -t PACKAGES < <(
            find "${OUT}" \
              -maxdepth 1 \
              -type f \
              -name 'Aether-OptExt_*.zip' \
              -print
          )

          if (( ${#PACKAGES[@]} != 1 )); then
            echo "::error::Expected exactly one Aether-OptExt ZIP, found ${#PACKAGES[@]}"
            printf '%s\n' "${PACKAGES[@]:-<none>}"
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"

          echo "Package: ${PACKAGE}"
          ls -lh "${PACKAGE}"

          ZIP_FILES="$(mktemp)"
          unzip -Z1 "${PACKAGE}" > "${ZIP_FILES}"

          required_files=(
            "service.sh"
            "gamelist"
            "module.prop"
            "customize.sh"
            "aether-optext"
            "threads.json"
            "META-INF/com/google/android/updater-script"
            "META-INF/com/google/android/update-binary"
            "Flags/README.md"
          )

          for file in "${required_files[@]}"; do
            if ! grep -Fxq "${file}" "${ZIP_FILES}"; then
              echo "::error::Required file missing from ZIP: ${file}"
              exit 1
            fi
          done

          echo "All required files are present."

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt-${{ github.sha }}
          path: source/out/Aether-OptExt_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 同时上传日志/二进制信息，方便排查 CI 问题。
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt-build-info-${{ github.sha }}
          path: |
            ebpf_target.o
            target/aarch64-linux-android/release/aether-optext
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SRC="${GITHUB_WORKSPACE}/source"
          OUT="${SRC}/out"

          # 获取本次真正编译的上游仓库 commit
          UPSTREAM_COMMIT="$(git -C "${SRC}" rev-parse HEAD)"
          UPSTREAM_SHORT="$(git -C "${SRC}" rev-parse --short=12 HEAD)"
          UPSTREAM_SUBJECT="$(git -C "${SRC}" log -1 --format=%s)"
          UPSTREAM_AUTHOR="$(git -C "${SRC}" log -1 --format='%an <%ae>')"
          UPSTREAM_DATE="$(git -C "${SRC}" log -1 --format=%cI)"

          TAG="upstream-${UPSTREAM_SHORT}"
          TITLE="Aether OptExt ${UPSTREAM_SHORT}"

          PACKAGE="$(find "${OUT}" \
            -maxdepth 1 \
            -type f \
            -name 'Aether-OptExt_*.zip' \
            -print -quit)"

          if [[ -z "${PACKAGE}" ]]; then
            echo "::error::Aether OptExt package not found."
            exit 1
          fi

          echo "Upstream commit : ${UPSTREAM_COMMIT}"
          echo "Upstream short  : ${UPSTREAM_SHORT}"
          echo "Commit subject  : ${UPSTREAM_SUBJECT}"
          echo "Commit author   : ${UPSTREAM_AUTHOR}"
          echo "Commit date     : ${UPSTREAM_DATE}"
          echo "Release tag     : ${TAG}"
          echo "Package         : ${PACKAGE}"

          NOTES="$(cat <<EOF
          ## Aether OptExt

          Automated build of upstream commit:

          **${UPSTREAM_COMMIT}**

          - Commit: ${UPSTREAM_SUBJECT}
          - Author: ${UPSTREAM_AUTHOR}
          - Date: ${UPSTREAM_DATE}
          - Upstream repository: https://github.com/NetizenNemo/Aether_OptExt/commit/${UPSTREAM_COMMIT}

          This release was built automatically by the CI workflow.

          ### Build environment

          - CI repository: \`${GITHUB_REPOSITORY}\`
          - CI workflow: \`${GITHUB_WORKFLOW}\`
          - CI run: \`${GITHUB_RUN_ID}\`
          - Android NDK: \`${ANDROID_NDK_VERSION}\`
          - eBPF Rust toolchain: \`${EBPF_TOOLCHAIN}\`
          EOF
          )"

          # 同一个上游 commit 使用同一个 tag。
          # 首次构建：创建 Release 并上传 ZIP。
          # 重复构建：更新 Release，然后覆盖同名 ZIP。
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."

            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "${NOTES}"

            gh release upload "${TAG}" \
              "${PACKAGE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating release ${TAG}..."

            gh release create "${TAG}" \
              "${PACKAGE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}"
          fi

          echo
          echo "Release:"
          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}"
